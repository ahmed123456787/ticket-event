version: "3.8"

services:
  web:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    container_name: event_ticket_web
    entrypoint: /app/deployment/entrypoint.sh
    volumes:
      - ..:/app
    expose:
      - "8000" # Changed from ports to expose since Nginx will handle external connections
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ../config/.env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  nginx:
    image: nginx:alpine
    container_name: event_ticket_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx:/etc/nginx/conf.d
      - ../staticfiles:/app/staticfiles
      - ../media:/app/media
    depends_on:
      - web
    restart: always

  db:
    image: postgres:14
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=event_ticket
    ports:
      - "5431:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7
    ports:
      - "6378:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  celery:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    command: celery -A ticket_system worker -l info
    volumes:
      - ..:/app
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
      web:
        condition: service_healthy
    env_file:
      - ../config/.env

  celery-beat:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    command: celery -A ticket_system beat -l info
    volumes:
      - ..:/app
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
      web:
        condition: service_healthy
    env_file:
      - ../config/.env

volumes:
  postgres_data:
